<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://testnet.ckb.dev">
<title>Brant withdrawal signer</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#0b0e0e;color:#f2f5f4}
main{max-width:48rem;margin:3rem auto;padding:0 1rem}
dd{margin:0 0 .8rem;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
dt,p{color:#aab8b4}
button,input{min-height:44px;margin:.5rem .5rem .5rem 0}
button{padding:0 1rem;border:0;border-radius:.6rem;background:#6cddb5;color:#0b0e0e;font:inherit}
button:disabled{opacity:.45}
</style>
<main>
<h1>Brant withdrawal signer</h1>
<p>Review a prepared Pudge withdrawal, sign it with UTXO Global and export the signed transaction for independent verification.</p>
<label for="file">Unsigned withdrawal review</label><br>
<input type="file" id="file" accept=".json,application/json">
<dl id="details"></dl>
<button id="connect" disabled>Connect UTXO Global</button>
<button id="sign" disabled>Sign and export</button>
<p id="status" role="status"></p>
</main>
<script src="./signer.js" defer></script>
</html>
